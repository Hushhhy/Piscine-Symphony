<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(160deg, #f5f7fb, #e9eef8); color: #1f2937; font-family: sans-serif;
        }
        form { 
            width: min(92vw, 460px); 
            border: 1px solid #d7deea; 
            border-radius: 12px; 
            background: #ffffff; 
            padding: 16px;
            box-shadow: 0 14px 30px rgba(31, 41, 55, 0.1); 
        }
        div { margin-bottom: 12px; }
        label { 
            display: block; 
            font-size: 0.92rem; 
            font-weight: 600; 
            margin-bottom: 6px; 
        }
        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="email"] {
            width: 100%;
            height: 38px;
            border: 1px solid #d7deea;
            border-radius: 8px;
            padding: 0 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus {
            border-color: #1d4ed8;
        }
        .gender-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .gender-group label,
        .student-row label {
            margin: 0;
            font-weight: 500;
        }

        .student-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="submit"] { 
            width: 100%; 
            border: none; 
            border-radius: 8px; 
            background: blue; 
            color: #fff; 
            font-weight: 700;
            height: 40px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <form action="" method="get">
        <div>
            <label for="firstname">Firstname</label>
            <input type="text" name="firstname" id="firstname" required>
        </div>
        <div>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required>
        </div>
        <div>
            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone">
        </div>
        <div>
            <label for="age">Age</label>
            <input type="number" name="age" id="age">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
        </div>
        <div>
            <label>Gender</label>
            <div class="gender-group">
            <label for="gender_male">Male</label>
            <input type="radio" name="gender" id="gender_male" value="Male">
            <label for="gender_female">Female</label>
            <input type="radio" name="gender" id="gender_female" value="Female">
            <label for="gender_other">Other</label>
            <input type="radio" name="gender" id="gender_other" value="Other">
            </div>
        </div>
        <div class="student-row">
            <label for="student">Student</label>
            <input type="checkbox" name="student" id="student">
        </div>
        <div>
            <input type="submit" value="Submit" onclick="displayFormContents()">
        </div>
    </form>
    <script src="popup.js"></script>
</body>
</html>
